<svg width="512" height="512" viewBox="61 61 110 110" xmlns="http://www.w3.org/2000/svg">
<title>Notch Sixty menu bar tray icon (inverted template — solid rect, cutout meter)</title>
<!--
  Inverted/negative-space template image:
  A solid filled rounded rect with the meter ticks, arc, needle, pivot, and
  "60" text punched out as transparent negative space via an SVG mask.
  Designed to be used as isTemplate = true — AppKit auto-tints for light/dark.
-->
<defs>
  <mask id="cutout">
    <!-- Mask base: white = keep (fill), black = cut out -->
    <rect x="61" y="61" width="110" height="110" fill="white"/>
    <!-- Arc segments -->
    <path d="M 82.17 111.69 A 36 36 0 0 1 139.14 96.42" fill="none" stroke="black" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 139.14 96.42 A 36 36 0 0 1 149.83 111.69" fill="none" stroke="black" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Tick marks -->
    <line x1="82.17" y1="111.69" x2="102.84" y2="119.21" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <line x1="96.66" y1="93.64"  x2="102.57" y2="102.92" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <line x1="116"   y1="88"     x2="116"    y2="110"    stroke="black" stroke-width="4" stroke-linecap="round"/>
    <line x1="135.34" y1="93.64" x2="129.43" y2="102.92" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <line x1="149.83" y1="111.69" x2="129.16" y2="119.21" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <!-- Needle (pointing upper-left, ~-45°) -->
    <line x1="116" y1="124" x2="88.47" y2="92.68" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Pivot dot -->
    <circle cx="116" cy="124" r="4" fill="black"/>
    <!-- "60" text -->
    <text x="121" y="148" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="black">60</text>
    <!-- Input jack icon (two horizontal dashes + vertical rect) -->
    <line x1="91" y1="142" x2="98" y2="142" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="102" y1="142" x2="109" y2="142" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="98" y="135" width="4" height="14" fill="black" rx="1.5"/>
  </mask>
</defs>
<!-- Solid rounded rect with cutouts applied via mask -->
<rect x="64" y="64" width="104" height="104" rx="16" fill="black" mask="url(#cutout)"/>
</svg>
